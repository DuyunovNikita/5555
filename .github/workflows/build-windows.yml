name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'SwipeKeyboard/**'
      - 'installer.iss'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Publish self-contained app
        shell: pwsh
        run: |
          dotnet publish .\SwipeKeyboard\SwipeKeyboard\SwipeKeyboard.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o .\publish
      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          & $iscc .\SwipeKeyboard\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SwipeKeyboard-Setup-win-x64
          path: SwipeKeyboard/output/SwipeKeyboard-Setup.exe
          if-no-files-found: error
          retention-days: 14
